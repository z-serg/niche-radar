; Niche Radar — согласованные лимиты (ТЗ §5.1, §12).
memory_limit = 1024M
upload_max_filesize = 5G
post_max_size = 5G
max_execution_time = 600
max_input_time = 600
default_charset = "UTF-8"

; Импорт потоковый: процессы не должны разрастаться от размера CSV.
implicit_flush = Off

[opcache]
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 192
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
