# Niche Radar — локальное развёртывание (ТЗ §12).
# Запуск: ./bin/setup && docker compose up -d --build
name: ${COMPOSE_PROJECT_NAME:-niche-radar}

services:
  db:
    image: postgres:17.11-bookworm
    # Большие сортировки (пресеты на 3+ млн строк) используют dynamic shared
    # memory; дефолтные 64 МБ Docker её переполняют («Disk full», SQLSTATE 53100).
    shm_size: '2gb'
    environment:
      POSTGRES_DB: ${DB_DATABASE:-niche_radar}
      POSTGRES_USER: ${DB_USERNAME:-niche_radar}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD обязателен (см. bin/setup)}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/10-extensions.sql:ro
    command:
      - postgres
      - -c
      - shared_buffers=1GB
      - -c
      - work_mem=64MB
      - -c
      - maintenance_work_mem=512MB
      - -c
      - max_wal_size=2GB
      - -c
      - checkpoint_completion_target=0.9
      - -c
      - effective_io_concurrency=200
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-niche_radar} -d ${DB_DATABASE:-niche_radar}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  migrate:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    image: niche-radar-app:latest
    env_file: .env
    volumes:
      - app_storage:/var/www/html/storage
    command: ["/usr/local/bin/niche-migrate"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    image: niche-radar-app:latest
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    env_file: .env
    volumes:
      - app_storage:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "php -r 'exit(0);'"]
      interval: 30s
      timeout: 5s
      retries: 3

  worker-import:
    image: niche-radar-app:latest
    env_file: .env
    volumes:
      - app_storage:/var/www/html/storage
    command: ["php", "artisan", "queue:work", "import", "--queue=import", "--tries=1", "--timeout=13800", "--sleep=2"]
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  worker-default:
    image: niche-radar-app:latest
    env_file: .env
    volumes:
      - app_storage:/var/www/html/storage
    command: ["php", "artisan", "queue:work", "default", "--queue=default", "--tries=1", "--timeout=840", "--sleep=2"]
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  scheduler:
    image: niche-radar-app:latest
    env_file: .env
    volumes:
      - app_storage:/var/www/html/storage
    command: ["php", "artisan", "schedule:work", "--no-interaction"]
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    image: niche-radar-web:latest
    ports:
      - "${APP_PORT:-127.0.0.1:8080}:80"
    depends_on:
      app:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres_data:
  app_storage:
