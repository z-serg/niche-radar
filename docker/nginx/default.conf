# Niche Radar: статика React + проксирование PHP-FPM.
# Лимит загрузки согласован с PHP и приложением (ТЗ §5.1).
# app-контейнер может пересоздаваться (новый IP): резолвим через Docker DNS,
# чтобы nginx не держал устаревший адрес upstream.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;

    root /var/www/html/public;
    index index.html;

    client_max_body_size 5g;
    client_body_timeout 600s;

    # Собранные ассеты React (иммутабельные).
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # API и точку входа PHP передаём в app (php-fpm).
    location /api/ {
        include /etc/nginx/fastcgi_params;
        set $app_upstream app:9000;
        fastcgi_pass $app_upstream;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_read_timeout 600s;
        fastcgi_buffers 256 16k;
        fastcgi_buffer_size 32k;
        break;
    }

    location = /index.php {
        include /etc/nginx/fastcgi_params;
        set $app_upstream app:9000;
        fastcgi_pass $app_upstream;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_read_timeout 600s;
        break;
    }

    location = /healthz {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    # SPA: все прочие маршруты отдают index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Приватные исходники недоступны (в образе их нет, страховка для .php вне public).
    location ~ /\. {
        deny all;
    }
}
